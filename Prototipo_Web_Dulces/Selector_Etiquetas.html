<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Etiquetas FDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4472C4 0%, #2E5C9A 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .label-type-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .label-type-selector label {
            font-weight: 600;
            color: #495057;
        }
        
        .label-type-selector select {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
        }
        
        .label-type-selector select:focus {
            outline: none;
            border-color: #4472C4;
            box-shadow: 0 0 0 3px rgba(68, 114, 196, 0.1);
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #4472C4;
            box-shadow: 0 0 0 3px rgba(68, 114, 196, 0.1);
        }
        
        .bulk-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        
        .products-container {
            padding: 30px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .product-card {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .product-card:hover {
            border-color: #4472C4;
            box-shadow: 0 5px 15px rgba(68, 114, 196, 0.2);
        }
        
        .product-card.selected {
            background: #f0f4ff;
            border-color: #4472C4;
        }
        
        .checkbox-container {
            flex-shrink: 0;
        }
        
        .checkbox-container input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        
        .product-info {
            flex: 1;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .product-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 13px;
            color: #6c757d;
        }
        
        .detail-item {
            display: flex;
            gap: 5px;
        }
        
        .detail-label {
            font-weight: 600;
            color: #495057;
        }
        
        .quantity-container {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .quantity-label {
            font-size: 12px;
            font-weight: 600;
            color: #6c757d;
        }
        
        .quantity-input {
            width: 100px;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
        }
        
        .quantity-input:focus {
            outline: none;
            border-color: #4472C4;
        }
        
        .quantity-input:disabled {
            background: #e9ecef;
            cursor: not-allowed;
        }
        
        .footer {
            padding: 30px;
            background: #f8f9fa;
            border-top: 2px solid #dee2e6;
        }
        
        .summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        
        .summary-item {
            flex: 1;
        }
        
        .summary-value {
            font-size: 32px;
            font-weight: 700;
            color: #4472C4;
            margin-bottom: 5px;
        }
        
        .summary-label {
            font-size: 14px;
            color: #6c757d;
            font-weight: 600;
        }
        
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.3);
        }
        
        .generate-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏷️ Sistema de Etiquetas FDA</h1>
            <p>Selecciona los productos y genera el Excel listo para imprimir</p>
        </div>
        
        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Buscar producto por nombre..."
                >
            </div>
            
            <div class="label-type-selector">
                <label for="labelType">Tipo de Etiqueta:</label>
                <select id="labelType" onchange="updateSummary()">
                    <option value="AVERY_8164">Avery 8164 (6 por hoja)</option>
                    <option value="LACTEO_AVERY_8164">Lacteo Avery 8164 (6 por hoja)</option>
                    <option value="PLS504">PLS504 (10 por hoja)</option>
                    <option value="AVERY_5260">Dulces - Avery 5260 (30 por hoja)</option>
                </select>
            </div>
            
            <div class="bulk-actions">
                <button class="btn btn-secondary" onclick="selectAll()">✅ Seleccionar Todos</button>
                <button class="btn btn-secondary" onclick="deselectAll()">❌ Deseleccionar Todos</button>
            </div>
        </div>
        
        <div id="alertContainer"></div>
        
        <div class="products-container" id="productsContainer">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </div>
        
        <div class="footer">
            <div class="summary">
                <div class="summary-item">
                    <div class="summary-value" id="selectedCount">0</div>
                    <div class="summary-label">Productos Seleccionados</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="totalLabels">0</div>
                    <div class="summary-label">Total de Etiquetas</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="totalSheets">0</div>
                    <div class="summary-label">Hojas a Imprimir</div>
                </div>
            </div>
            <button class="generate-btn" id="generateBtn" onclick="generateExcel()" disabled>
                📄 Generar Excel para Impresión
            </button>
        </div>
    </div>
    
    <script>
        let products = [];
        
        // Cargar productos desde el Excel
        async function loadProducts() {
            try {
                const response = await fetch('productos.json');
                products = await response.json();
                renderProducts();
            } catch (error) {
                showAlert('Error al cargar productos. Asegúrate de ejecutar el script Python primero.', 'error');
            }
        }
        
        // Renderizar productos
        function renderProducts(filter = '') {
            const container = document.getElementById('productsContainer');
            const filtered = products.filter(p => 
                p.Product_Name.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 64px; margin-bottom: 20px;">📦</div>
                        <h3>No se encontraron productos</h3>
                        <p>Intenta con otro término de búsqueda</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map((product, index) => `
                <div class="product-card" id="card-${index}">
                    <div class="checkbox-container">
                        <input 
                            type="checkbox" 
                            id="check-${index}" 
                            onchange="toggleProduct(${index})"
                        >
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.Product_Name}</div>
                        <div class="product-details">
                            <div class="detail-item">
                                <span class="detail-label">Porción:</span>
                                <span>${product.Serving_Size}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Calorías:</span>
                                <span>${product.Calories}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Peso Neto:</span>
                                <span>${product.Net_Weight}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Vencimiento:</span>
                                <span>${product.Expiration_Date}</span>
                            </div>
                        </div>
                    </div>
                    <div class="quantity-container">
                        <span class="quantity-label">CANTIDAD</span>
                        <input 
                            type="number" 
                            class="quantity-input" 
                            id="qty-${index}" 
                            value="1" 
                            min="1" 
                            max="999"
                            disabled
                            onchange="updateSummary()"
                        >
                    </div>
                </div>
            `).join('');
        }
        
        // Toggle producto
        function toggleProduct(index) {
            const checkbox = document.getElementById(`check-${index}`);
            const quantityInput = document.getElementById(`qty-${index}`);
            const card = document.getElementById(`card-${index}`);
            
            if (checkbox.checked) {
                quantityInput.disabled = false;
                card.classList.add('selected');
            } else {
                quantityInput.disabled = true;
                card.classList.remove('selected');
            }
            
            updateSummary();
        }
        
        // Seleccionar todos
        function selectAll() {
            products.forEach((_, index) => {
                const checkbox = document.getElementById(`check-${index}`);
                if (checkbox) {
                    checkbox.checked = true;
                    toggleProduct(index);
                }
            });
        }
        
        // Deseleccionar todos
        function deselectAll() {
            products.forEach((_, index) => {
                const checkbox = document.getElementById(`check-${index}`);
                if (checkbox) {
                    checkbox.checked = false;
                    toggleProduct(index);
                }
            });
        }
        
        // Actualizar resumen
        function updateSummary() {
            let selectedCount = 0;
            let totalLabels = 0;
            
            products.forEach((_, index) => {
                const checkbox = document.getElementById(`check-${index}`);
                const quantityInput = document.getElementById(`qty-${index}`);
                
                if (checkbox && checkbox.checked) {
                    selectedCount++;
                    totalLabels += parseInt(quantityInput.value) || 0;
                }
            });
            
            // Calcular hojas según tipo de etiqueta
            const labelType = document.getElementById('labelType').value;
            let totalSheets;
            
            if (labelType === 'PLS504') {
                totalSheets = Math.ceil(totalLabels / 10); // 10 etiquetas por hoja
            } else if (labelType === 'AVERY_5260') {
                totalSheets = Math.ceil(totalLabels / 30); // 30 etiquetas por hoja (Dulces)
            } else {
                // AVERY_8164 y LACTEO_AVERY_8164 usan 6 etiquetas por hoja
                totalSheets = Math.ceil(totalLabels / 6); // 6 etiquetas por hoja
            }
            
            document.getElementById('selectedCount').textContent = selectedCount;
            document.getElementById('totalLabels').textContent = totalLabels;
            document.getElementById('totalSheets').textContent = totalSheets;
            
            document.getElementById('generateBtn').disabled = selectedCount === 0;
        }
        
        // Generar Excel
        async function generateExcel() {
            const selectedProducts = [];
            const labelType = document.getElementById('labelType').value;
            
            products.forEach((product, index) => {
                const checkbox = document.getElementById(`check-${index}`);
                const quantityInput = document.getElementById(`qty-${index}`);
                
                if (checkbox && checkbox.checked) {
                    selectedProducts.push({
                        ...product,
                        Cantidad_a_Imprimir: parseInt(quantityInput.value) || 1
                    });
                }
            });
            
            if (selectedProducts.length === 0) {
                showAlert('Debes seleccionar al menos un producto', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        products: selectedProducts,
                        label_type: labelType
                    })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Etiquetas_Para_Imprimir.xlsx';
                    a.click();
                    
                    showAlert(`✅ Excel generado exitosamente: ${document.getElementById('totalLabels').textContent} etiquetas en ${document.getElementById('totalSheets').textContent} hojas (${labelType})`, 'success');
                } else {
                    showAlert('Error al generar Excel. Verifica que el servidor Python esté corriendo.', 'error');
                }
            } catch (error) {
                showAlert('Error de conexión. Asegúrate de que el servidor Python esté corriendo.', 'error');
            }
        }
        
        // Mostrar alertas
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            container.innerHTML = `
                <div class="alert ${alertClass}" style="margin: 20px 30px 0;">
                    ${message}
                </div>
            `;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // Búsqueda
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderProducts(e.target.value);
        });
        
        // Cargar productos al inicio
        loadProducts();
    </script>
</body>
</html>
